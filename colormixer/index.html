<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="style.css">
    <script>
        function colorMixer() {
            var red = document.getElementById("red").value;
            var green = document.getElementById("green").value;
            var blue = document.getElementById("blue").value;

            var color = "rgb(" + red + "," + green + "," + blue + ")";

            document.getElementById("sample").style.backgroundColor = color;
            document.getElementById("color-output").innerHTML = "background-color: " + color + ";";
        }
    </script>
</head>
<body>

<div id="sample" style="width:200px; height:200px; border:1px solid black;"></div><br>

<label for="red">Red: </label>
<input type="range" id="red" min="0" max="255" value="0" onchange="colorMixer()"><br>

<label for="green">Green: </label>
<input type="range" id="green" min="0" max="255" value="0" onchange="colorMixer()"><br>

<label for="blue">Blue: </label>
<input type="range" id="blue" min="0" max="255" value="0" onchange="colorMixer()"><br>

<span id="color-output">background-color: rgb(0,0,0);</span><br><br>

<script>
var colors = ["red", "green", "blue", "orange", "yellow", "purple"];

document.write("<ul>");

for (var counter = 0; counter < colors.length; counter++) {
    document.write("<li>" + colors[counter] + "</li>");
}

document.write("</ul>");
</script>

</body>
</html>
